<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Engineer Practical Trainer</title>
<style>
:root{
  --bg:#f4f2ee; --card:#ffffff; --ink:#1c1b19; --muted:#6b6862; --line:#e2ded6;
  --accent:#b3261e; --accent-ink:#ffffff; --good:#1f7a3d; --good-bg:#e3f3e7;
  --bad:#b3261e; --bad-bg:#fbe6e4; --track:#e7e3db; --gold:#c98a00;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#141312; --card:#1f1e1c; --ink:#f1eee8; --muted:#a39f97; --line:#34322e;
    --accent:#e2574c; --accent-ink:#1a0705; --good:#5fca83; --good-bg:#173022;
    --bad:#f0857c; --bad-bg:#3a1b18; --track:#2e2c29; --gold:#e6b23c;
  }
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-tap-highlight-color:transparent}
#app{max-width:560px;margin:0 auto;padding:12px 16px calc(32px + env(safe-area-inset-bottom))}
.top{display:flex;align-items:center;gap:10px;min-height:48px;margin-bottom:8px}
.top h1{font-size:18px;margin:0;flex:1;line-height:1.2}
.back{border:0;background:none;color:var(--ink);font-size:26px;line-height:1;padding:6px 10px 8px 0;cursor:pointer}
.pill{font-size:13px;font-weight:600;padding:4px 10px;border-radius:999px;background:var(--card);border:1px solid var(--line);white-space:nowrap}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin:10px 0}
button.card{display:block;width:100%;text-align:left;font:inherit;color:inherit;cursor:pointer}
button.card:active{transform:scale(.99)}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px}
.title{font-weight:650}
.sub{color:var(--muted);font-size:13px}
.bar{height:8px;background:var(--track);border-radius:99px;overflow:hidden;margin-top:10px}
.bar i{display:block;height:100%;background:var(--accent);border-radius:99px;transition:width .3s}
.bar.done i{background:var(--good)}
.btn{display:block;width:100%;border:0;border-radius:12px;padding:14px 16px;font:inherit;font-weight:650;cursor:pointer;background:var(--accent);color:var(--accent-ink);margin:10px 0}
.btn.ghost{background:var(--card);color:var(--ink);border:1px solid var(--line)}
.btn:active{transform:scale(.99)}
.btn small{display:block;font-weight:400;opacity:.85;font-size:13px}
h2{font-size:14px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:22px 0 4px}
.ctx{color:var(--muted);font-size:15px;margin:2px 0}
.q{font-size:20px;font-weight:650;margin:14px 0 10px}
.opt{display:block;width:100%;text-align:left;font:inherit;color:inherit;background:var(--card);border:1.5px solid var(--line);border-radius:12px;padding:13px 14px;margin:8px 0;cursor:pointer}
.opt.right{border-color:var(--good);background:var(--good-bg)}
.opt.wrong{border-color:var(--bad);background:var(--bad-bg)}
.opt:disabled{cursor:default;color:inherit;opacity:1}
.shake{animation:shake .3s}
@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.steps{list-style:none;margin:0;padding:0}
.steps li{padding:7px 0;border-bottom:1px solid var(--line)}
.steps li:last-child{border-bottom:0}
.d1{padding-left:18px!important}.d2{padding-left:36px!important}.d3{padding-left:54px!important}
.miss{color:var(--bad)}.hit{color:var(--good)}
.blank{color:var(--muted);letter-spacing:.08em}
.seg{display:flex;gap:6px;margin:10px 0}
.seg button{flex:1;font:inherit;font-size:14px;padding:9px 4px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer}
.seg button.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
input[type=text]{width:100%;font:inherit;padding:13px 14px;border-radius:12px;border:1.5px solid var(--line);background:var(--card);color:var(--ink)}
.msg{min-height:22px;font-size:14px;color:var(--muted);margin:6px 2px}
.big{font-size:44px;font-weight:750;text-align:center;margin:18px 0 0}
.center{text-align:center}
.foot{color:var(--muted);font-size:12px;margin-top:28px;text-align:center}
.link{background:none;border:0;color:var(--muted);text-decoration:underline;font:inherit;font-size:12px;cursor:pointer}
.prog{font-size:13px;color:var(--muted)}
</style>
</head>

/* ---------- Setup ---------- */
const KEY='ept-v1';
const ALL=[];
DATA.forEach(s=>s.groups.forEach((g,gi)=>{
  g.id=s.id+'-'+gi; g.sec=s;
  g.steps=g.lines.map((l,i)=>{const d=l.match(/^>*/)[0].length;return{t:l.slice(d),d,i}});
  ALL.push(g);
}));
let S={};
try{S=JSON.parse(localStorage.getItem(KEY))||{}}catch(e){}
S.s=S.s||{};S.xp=S.xp||0;S.streak=S.streak||0;S.last=S.last||'';S.numBest=S.numBest||0;
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}};
const rec=(g,i,ok)=>{(S.s[g.id]=S.s[g.id]||{})[i]=ok?1:0;if(ok)S.xp+=10};
const mastery=g=>{const m=S.s[g.id]||{};return g.steps.filter(st=>m[st.i]===1).length/g.steps.length};
const secMastery=s=>{let a=0,b=0;s.groups.forEach(g=>{a+=mastery(g)*g.steps.length;b+=g.steps.length});return a/b};
const day=d=>d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate();
function touchStreak(){
  const t=day(new Date());if(S.last===t)return;
  const y=new Date();y.setDate(y.getDate()-1);
  S.streak=S.last===day(y)?S.streak+1:1;S.last=t;
}
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};

function $(t,a,...c){
  const e=document.createElement(t);a=a||{};
  for(const k in a){if(k==='class')e.className=a[k];else if(k.slice(0,2)==='on')e.addEventListener(k.slice(2),a[k]);else e.setAttribute(k,a[k])}
  c.flat(Infinity).forEach(x=>{if(x!=null&&x!==false)e.append(x.nodeType?x:document.createTextNode(String(x)))});
  return e;
}
const app=document.getElementById('app');
const stack=[];
function go(fn){stack.push(fn);draw()}
function back(n){for(let i=0;i<(n||1)&&stack.length>1;i++)stack.pop();draw()}
function draw(){app.replaceChildren(...stack[stack.length-1]().flat(Infinity).filter(x=>x!=null&&x!==false));window.scrollTo(0,0)}
function hdr(title,right){
  return $('div',{class:'top'},stack.length>1&&$('button',{class:'back','aria-label':'Back',onclick:()=>back()},'‹'),$('h1',{},title),right);
}
const bar=p=>$('div',{class:'bar'+(p>=1?' done':'')},$('i',{style:'width:'+Math.round(p*100)+'%'}));
const pct=p=>Math.round(p*100)+'%';

/* ---------- Screens ---------- */
function home(){
  const total=ALL.reduce((a,g)=>a+g.steps.length,0);
  const done=ALL.reduce((a,g)=>a+mastery(g)*g.steps.length,0);
  return [
    hdr('Engineer Practical Trainer',$('span',{class:'pill'},'🔥 '+S.streak+' day'+(S.streak===1?'':'s'))),
    $('div',{class:'card'},
      $('div',{class:'row'},$('span',{class:'title'},'Overall'),$('span',{class:'sub'},Math.round(done)+' of '+total+' steps · '+S.xp+' XP')),
      bar(done/total)),
    $('button',{class:'btn',onclick:quickPlay},'Quick play',$('small',{},'Drills the part you know least')),
    $('button',{class:'btn ghost',onclick:()=>go(numbers())},'Numbers round',$('small',{},'Pressures, speeds and distances'+(S.numBest?' · best '+S.numBest+'/10':''))),
    $('h2',{},'Sections'),
    DATA.map(s=>$('button',{class:'card',onclick:()=>go(()=>section(s))},
      $('div',{class:'row'},$('span',{class:'title'},s.title),$('span',{class:'sub'},pct(secMastery(s)))),
      bar(secMastery(s)))),
    $('p',{class:'foot'},'Content from the 2026 Engineer Bibliography, pages 65-81. For crew study only; the current packet is always the authority. Progress is saved on this device. ',
      $('button',{class:'link',onclick:()=>{if(confirm('Erase all progress on this device?')){S={s:{},xp:0,streak:0,last:'',numBest:0};save();draw()}}},'Reset progress'))
  ];
}
function section(s){
  return [hdr(s.title),
    s.groups.map(g=>$('button',{class:'card',onclick:()=>go(()=>group(g))},
      $('div',{class:'row'},$('span',{class:'title'},g.title),$('span',{class:'sub'},g.steps.length+' steps · '+pct(mastery(g)))),
      bar(mastery(g))))];
}
function group(g){
  const all=g.steps.map(s=>s.i);
  return [hdr(g.title),
    $('div',{class:'card'},$('div',{class:'row'},$('span',{class:'sub'},g.sec.title),$('span',{class:'sub'},pct(mastery(g))+' mastered')),bar(mastery(g))),
    $('button',{class:'btn ghost',onclick:()=>go(study(g))},'Study',$('small',{},'Read it, then hide the words')),
    $('button',{class:'btn',onclick:()=>go(nextDrill(g,all))},'What comes next?',$('small',{},'Pick the next step')),
    $('button',{class:'btn',onclick:()=>go(orderDrill(g))},'Put in order',$('small',{},'Tap the shuffled steps in sequence')),
    $('button',{class:'btn',onclick:()=>go(recallDrill(g))},'From memory',$('small',{},'Type every step you can remember'))];
}
function quickPlay(){
  const sorted=ALL.slice().sort((a,b)=>mastery(a)-mastery(b));
  const g=mastery(sorted[0])>=1?ALL[Math.floor(Math.random()*ALL.length)]:sorted[0];
  const m=S.s[g.id]||{};
  let idx=g.steps.filter(st=>m[st.i]!==1).map(st=>st.i);
  if(!idx.length)idx=g.steps.map(st=>st.i);
  go(nextDrill(g,idx.slice(0,10)));
}

/* Study: full text, first letters, or hidden (tap a line to reveal it) */
function study(g){
  let mode=0;const open=new Set();
  const first=t=>t.split(' ').map(w=>w[0]+'·'.repeat(Math.min(3,Math.max(0,w.length-1)))).join(' ');
  return function view(){
    const seg=$('div',{class:'seg'},['Full text','First letters','Hidden'].map((n,i)=>
      $('button',{class:mode===i?'on':'',onclick:()=>{mode=i;open.clear();draw()}},n)));
    const list=$('ul',{class:'steps card'},g.steps.map(st=>{
      const show=mode===0||open.has(st.i);
      return $('li',{class:'d'+st.d+(show?'':' blank'),onclick:()=>{if(mode){open.has(st.i)?open.delete(st.i):open.add(st.i);draw()}}},
        show?st.t:mode===1?first(st.t):'• • •');
    }));
    return [hdr(g.title),seg,mode?$('p',{class:'sub'},'Say each line, then tap it to check.'):null,list];
  };
}

function ctxLines(g,i){
  if(i===0)return [$('p',{class:'ctx'},'Start of "'+g.title+'"')];
  return g.steps.slice(Math.max(0,i-3),i).map(s=>$('p',{class:'ctx d'+s.d},s.t));
}

/* What comes next: multiple choice through the listed steps */
function nextDrill(g,idxs){
  let q=0,right=0;const missed=[];
  return function view(){
    if(q>=idxs.length)return result(g,right,idxs.length,missed);
    const st=g.steps[idxs[q]];
    const used=new Set([st.t]);if(st.i>0)used.add(g.steps[st.i-1].t);
    const pick=(pool,n)=>{const out=[];for(const t of shuffle(pool)){if(out.length>=n)break;if(!used.has(t)){used.add(t);out.push(t)}}return out};
    let wrong=pick(g.steps.filter(s=>s.i>st.i).map(s=>s.t),2);
    wrong=wrong.concat(pick(g.sec.groups.filter(x=>x!==g).flatMap(x=>x.steps.map(s=>s.t)),3-wrong.length));
    wrong=wrong.concat(pick(g.steps.map(s=>s.t),3-wrong.length));
    const nextBtn=$('button',{class:'btn',style:'display:none',onclick:()=>{q++;draw()}},'Next');
    const opts=shuffle([st.t].concat(wrong)).map(t=>$('button',{class:'opt',onclick:e=>{
      const ok=t===st.t;
      opts.forEach(o=>{o.disabled=true;if(o.textContent===st.t)o.classList.add('right')});
      if(ok){right++;setTimeout(()=>{q++;draw()},650)}
      else{e.currentTarget.classList.add('wrong');missed.push(st.i);nextBtn.style.display='block'}
      rec(g,st.i,ok);save();
    }},t));
    return [hdr(g.title,$('span',{class:'prog'},(q+1)+' / '+idxs.length)),bar(q/idxs.length),
      $('div',{class:'card'},ctxLines(g,st.i)),$('p',{class:'q'},'What comes next?'),opts,nextBtn];
  };
}

/* Put in order: tap shuffled steps in sequence, five at a time */
function orderDrill(g){
  const chunks=[];for(let i=0;i<g.steps.length;i+=5)chunks.push(g.steps.slice(i,i+5));
  if(chunks.length>1&&chunks[chunks.length-1].length<2)chunks[chunks.length-2].push(...chunks.pop());
  let c=0,k=0,right=0,slip=false,tiles=null;const missed=[];
  return function view(){
    if(c>=chunks.length)return result(g,right,g.steps.length,missed);
    const ch=chunks[c];
    if(!tiles)tiles=shuffle(ch.slice(k).map(s=>s.t));
    const placed=$('ul',{class:'steps card'},ch[0].i>0&&k===0?ctxLines(g,ch[0].i).slice(-1):null,ch.slice(0,k).map(s=>$('li',{class:'d'+s.d},s.t)));
    const btns=tiles.map((t,ti)=>$('button',{class:'opt',onclick:e=>{
      const st=ch[k];
      if(t===st.t){
        if(slip)missed.push(st.i);else right++;
        rec(g,st.i,!slip);save();slip=false;tiles.splice(ti,1);k++;
        if(k>=ch.length){c++;k=0;tiles=null}
        draw();
      }else{slip=true;e.currentTarget.classList.remove('shake');void e.currentTarget.offsetWidth;e.currentTarget.classList.add('shake')}
    }},t));
    const before=chunks.slice(0,c).reduce((a,x)=>a+x.length,0)+k;
    return [hdr(g.title,$('span',{class:'prog'},before+' / '+g.steps.length)),bar(before/g.steps.length),
      $('p',{class:'q'},'Tap the steps in order'),(k>0||ch[0].i>0)?placed:null,btns];
  };
}

/* From memory: type items, loose matching against the list */
const STOP=new Set('check the all for and of to a an or is are on in your any be it its with as that if at from into this'.split(' '));
const toks=t=>t.toLowerCase().replace(/[^a-z0-9/½ ]+/g,' ').split(' ').filter(w=>w&&!STOP.has(w)).map(w=>w.length>3?w.replace(/(es|s)$/,''):w);
const same=(a,b)=>a===b||(a.length>=4&&b.length>=4&&(a.startsWith(b)||b.startsWith(a)));
function matchScore(input,target){
  const a=toks(input),b=toks(target.replace(/\([^)]*\)/g,' '));if(!a.length||!b.length)return{sc:0,exact:false};
  const hit=b.filter(x=>a.some(y=>same(x,y))).length,used=a.filter(y=>b.some(x=>same(x,y))).length;
  return{sc:used/a.length<0.5?0:hit/b.length,exact:hit>0&&used===a.length};
}
function recallDrill(g){
  const found=new Set();let done=false,msg='';
  return function view(){
    if(done){
      g.steps.forEach(s=>rec(g,s.i,found.has(s.i)));touchStreak();save();
      return [hdr(g.title),$('p',{class:'big'},found.size+' / '+g.steps.length),
        $('p',{class:'center sub'},found.size===g.steps.length?'Every step, from memory.':'The ones in red are the ones you missed.'),
        $('ul',{class:'steps card'},g.steps.map(s=>$('li',{class:'d'+s.d+(found.has(s.i)?' hit':' miss')},s.t))),
        $('button',{class:'btn',onclick:()=>{stack.pop();go(recallDrill(g))}},'Try again'),
        $('button',{class:'btn ghost',onclick:()=>back()},'Done')];
    }
    const input=$('input',{type:'text',placeholder:'Type a step, then Enter',autocomplete:'off',autocapitalize:'off','aria-label':'Type a step'});
    const submit=()=>{
      const v=input.value.trim();if(!v)return;
      let best=null,bs=0;const exact=[];
      g.steps.forEach(s=>{if(found.has(s.i))return;const m=matchScore(v,s.t);if(m.exact)exact.push(s);if(m.sc>bs){bs=m.sc;best=s}});
      /* a short answer counts when its words point at exactly one remaining step */
      if(bs<0.5&&exact.length===1){best=exact[0];bs=1}
      if(best&&bs>=0.5){found.add(best.i);msg='✓ '+best.t;if(found.size===g.steps.length)done=true}
      else msg='No match for "'+v+'" (or you already have it).';
      draw();
    };
    input.addEventListener('keydown',e=>{if(e.key==='Enter')submit()});
    setTimeout(()=>input.focus(),0);
    return [hdr(g.title,$('span',{class:'prog'},found.size+' / '+g.steps.length)),bar(found.size/g.steps.length),
      $('p',{class:'q'},'List every step you remember'),
      $('p',{class:'sub'},'Any order, your own words. Key words are enough.'),
      input,$('p',{class:'msg'},msg),
      $('ul',{class:'steps card'},g.steps.map(s=>$('li',{class:'d'+s.d+(found.has(s.i)?'':' blank')},found.has(s.i)?s.t:'· · ·'))),
      $('button',{class:'btn ghost',onclick:()=>{done=true;draw()}},'I\'m done, show what I missed')];
  };
}

function result(g,right,total,missed){
  touchStreak();save();
  const uniq=[...new Set(missed)].sort((a,b)=>a-b);
  return [hdr(g.title),$('p',{class:'big'},right+' / '+total),
    $('p',{class:'center sub'},right===total?'Clean run.':'Missed steps are listed below.'),
    uniq.length?$('ul',{class:'steps card'},uniq.map(i=>$('li',{class:'miss d'+g.steps[i].d},g.steps[i].t))):null,
    uniq.length?$('button',{class:'btn',onclick:()=>{stack.pop();go(nextDrill(g,uniq))}},'Retry the ones I missed'):null,
    $('button',{class:'btn ghost',onclick:()=>back()},'Done')];
}

/* Numbers round: ten quick questions */
function numbers(){
  const qs=shuffle(NUMS).slice(0,10);let q=0,right=0;
  return (function(){
    return function view(){
      if(q>=qs.length){
        if(right>S.numBest)S.numBest=right;S.xp+=right*10;touchStreak();save();
        return [hdr('Numbers round'),$('p',{class:'big'},right+' / '+qs.length),
          $('p',{class:'center sub'},'Best so far: '+S.numBest+' / 10'),
          $('button',{class:'btn',onclick:()=>{stack.pop();go(numbers())}},'Play again'),
          $('button',{class:'btn ghost',onclick:()=>back()},'Done')];
      }
      const [text,ans,wrong]=qs[q];
      const nextBtn=$('button',{class:'btn',style:'display:none',onclick:()=>{q++;draw()}},'Next');
      const opts=shuffle([ans].concat(wrong)).map(t=>$('button',{class:'opt',onclick:e=>{
        opts.forEach(o=>{o.disabled=true;if(o.textContent===ans)o.classList.add('right')});
        if(t===ans){right++;setTimeout(()=>{q++;draw()},650)}
        else{e.currentTarget.classList.add('wrong');nextBtn.style.display='block'}
      }},t));
      return [hdr('Numbers round',$('span',{class:'prog'},(q+1)+' / '+qs.length)),bar(q/qs.length),$('p',{class:'q'},text),opts,nextBtn];
    };
  })();
}

/* go() expects a function that returns the screen; drills return such a function */
const _go=go;
go=function(fn){_go(fn)};
_go(home);
</script>
</body>
